name: Publish to npm

on:
  push:
    tags: ['v*']

permissions:
  id-token: write   # lets GitHub prove its identity to npm; no token stored
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm test
      - run: npm publish
